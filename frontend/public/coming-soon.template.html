<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECG Learning Portal — Coming Soon</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f4f6f4;
            --bg-sidebar: #0a2f1d;
            --bg-sidebar-hover: #123f28;
            --text-main: #111827;
            --text-muted: #4b5563;
            --primary: #064e3b;
            --border-color: #d1d5db;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-secondary); color: var(--text-main); line-height: 1.5; }
        .app-layout { display: flex; width: 100%; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--bg-sidebar); color: #ffffff; display: flex; flex-direction: column; border-right: 1px solid #062314; flex-shrink: 0; }
        .sidebar-brand { padding: 1.5rem 1.25rem; font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid #123f28; display: flex; align-items: center; gap: 0.75rem; background: #082818; }
        .sidebar-nav { padding: 1rem 0; flex: 1; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.25rem; color: #d1d5db; text-decoration: none; font-size: 0.9rem; font-weight: 500; border-left: 3px solid transparent; }
        .nav-item:hover { background: var(--bg-sidebar-hover); color: #ffffff; }
        .nav-item.active { background: var(--bg-sidebar-hover); color: #ffffff; border-left-color: #34d399; font-weight: 600; }
        .nav-left { display: flex; align-items: center; gap: 0.75rem; }
        .coming-soon-badge { font-size: 0.65rem; background: #123f28; color: #9ca3af; padding: 0.125rem 0.375rem; border: 1px solid #1e5638; text-transform: uppercase; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg-secondary); overflow-y: auto; }
        .topbar { height: 60px; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; flex-shrink: 0; }
        .topbar-title { font-size: 1rem; font-weight: 600; color: var(--primary); }
        .content-body { padding: 3rem 2rem; max-width: 900px; width: 100%; margin: 0 auto; }
        .placeholder-view { background: var(--bg-primary); border: 1px solid var(--border-color); padding: 4rem 2rem; text-align: center; }
        .placeholder-view h3 { font-size: 1.5rem; color: var(--primary); margin-bottom: 0.75rem; }
        .placeholder-view p { color: var(--text-muted); font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i data-lucide="activity" style="width: 20px; height: 20px; color: #34d399;"></i>
                <span>ECG Platform</span>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav-container">
                <!-- Injected via script based on filename -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-title" id="page-title">Module</div>
                <div style="font-size: 0.875rem; color: var(--text-muted);">Medical Education Portal</div>
            </header>

            <div class="content-body">
                <div class="placeholder-view">
                    <h3 id="module-heading">Feature Coming Soon</h3>
                    <p id="module-desc">This module is currently under development as part of the institutional roadmap.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        const path = window.location.pathname.split('/').pop() || 'analyzer.html';
        const titles = {
            'analyzer.html': ['AI ECG Analyzer', 'Automated rhythm detection, heart rate extraction, and classification confidence scoring.'],
            'upload.html': ['ECG Image Upload', 'Secure drag-and-drop interface supporting PNG, JPG, and PDF 12-lead strip formats.'],
            'resources.html': ['Learning Resources', 'Curated clinical reference library on electrophysiology, intervals, and axis deviations.'],
            'history.html': ['ECG History', 'Archive of past analyzed cases, quiz attempts, and diagnostic notes.'],
            'performance.html': ['Progress & Performance', 'Granular proficiency metrics per cardiac category and historical improvement curves.'],
            'profile.html': ['User Profile', 'Institutional credentials and account settings.'],
            'settings.html': ['Platform Settings', 'System preferences and configuration options.']
        };

        const info = titles[path] || ['Coming Soon', 'This feature is under development.'];
        document.getElementById('page-title').innerText = info[0];
        document.getElementById('module-heading').innerText = info[0];
        document.getElementById('module-desc').innerText = info[1];

        // Render sidebar with correct active item
        const navItems = [
            { href: '/', icon: 'home', label: 'Home', soon: false },
            { href: '/analyzer.html', icon: 'cpu', label: 'ECG Analyzer', soon: true },
            { href: '/quiz.html', icon: 'help-circle', label: 'ECG Quiz', soon: false },
            { href: '/upload.html', icon: 'upload-cloud', label: 'ECG Image Upload', soon: true },
            { href: '/resources.html', icon: 'book-open', label: 'Learning Resources', soon: true },
            { href: '/history.html', icon: 'clock', label: 'ECG History', soon: true },
            { href: '/performance.html', icon: 'bar-chart-2', label: 'Progress & Performance', soon: true },
            { href: '/profile.html', icon: 'user', label: 'Profile', soon: true },
            { href: '/settings.html', icon: 'settings', label: 'Settings', soon: true }
        ];

        const navContainer = document.getElementById('sidebar-nav-container');
        navContainer.innerHTML = navItems.map(item => `
            <a class="nav-item ${window.location.pathname.endsWith(item.href) ? 'active' : ''}" href="${item.href}">
                <div class="nav-left"><i data-lucide="${item.icon}" style="width: 18px; height: 18px;"></i><span>${item.label}</span></div>
                ${item.soon ? '<span class="coming-soon-badge">Soon</span>' : ''}
            </a>
        `).join('');
        lucide.createIcons();
    </script>
</body>
</html>
